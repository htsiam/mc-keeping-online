<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STATUS • Herobrine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-input: #0d1117;
      --border: #30363d;
      --border-hover: #484f58;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --green: #3fb950;
      --green-glow: rgba(63, 185, 80, 0.35);
      --red: #f85149;
      --red-glow: rgba(248, 81, 73, 0.35);
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --radius: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    /* Header */
    header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      border: 1px solid transparent;
      transition: all 0.3s ease;
    }

    .status-pill.online {
      background: rgba(63, 185, 80, 0.12);
      color: var(--green);
      border-color: rgba(63, 185, 80, 0.3);
      box-shadow: 0 0 20px var(--green-glow);
    }

    .status-pill.offline {
      background: rgba(248, 81, 73, 0.12);
      color: var(--red);
      border-color: rgba(248, 81, 73, 0.3);
      box-shadow: 0 0 20px var(--red-glow);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    /* Main layout */
    main {
      flex: 1;
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
      padding: 28px 20px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Status Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 16px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
    }

    .info-item label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .info-item value {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Terminal */
    .terminal {
      background: #010409;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 380px;
      min-height: 280px;
    }

    .terminal-header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .terminal-dots {
      display: flex;
      gap: 6px;
      margin-right: 8px;
    }

    .terminal-dots span {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #30363d;
    }

    .terminal-dots span:nth-child(1) { background: #ff5f56; }
    .terminal-dots span:nth-child(2) { background: #ffbd2e; }
    .terminal-dots span:nth-child(3) { background: #27c93f; }

    .terminal-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.65;
      scrollbar-width: thin;
      scrollbar-color: #30363d transparent;
    }

    .terminal-body::-webkit-scrollbar {
      width: 8px;
    }
    .terminal-body::-webkit-scrollbar-track {
      background: transparent;
    }
    .terminal-body::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 4px;
    }

    .log-line {
      margin-bottom: 2px;
      word-break: break-word;
    }

    .log-time {
      color: #6e7681;
      margin-right: 8px;
    }

    .log-system { color: #8b949e; }
    .log-chat { color: #e6edf3; }
    .log-sent { color: #58a6ff; }
    .log-error { color: #f85149; }
    .log-success { color: #3fb950; }

    /* Input area */
    .input-area {
      display: flex;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }

    .input-area input {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-area input::placeholder {
      color: #6e7681;
    }

    .input-area input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
    }

    .btn-send {
      background: var(--accent);
      color: #0d1117;
      border: none;
      border-radius: 8px;
      padding: 0 22px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-send:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-send:active {
      transform: translateY(1px);
      background: #4d9aed;
    }

    .btn-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Responsive */
    @media (max-width: 600px) {
      header {
        padding: 16px;
      }
      main {
        padding: 16px 12px 28px;
      }
      .card {
        padding: 16px;
      }
      .terminal {
        height: 320px;
      }
      .input-area {
        flex-direction: column;
        gap: 10px;
      }
      .btn-send {
        width: 100%;
        justify-content: center;
        padding: 12px;
      }
      .info-grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">STATUS</div>
    <div id="statusPill" class="status-pill offline">
      <span class="status-dot"></span>
      <span id="statusText">OFFLINE</span>
    </div>
  </header>

  <main>
    <!-- Status Card -->
    <div class="card">
      <div class="card-title">Bot Info</div>
      <div class="info-grid">
        <div class="info-item">
          <label>Username</label>
          <value id="botName">Herobrine</value>
        </div>
        <div class="info-item">
          <label>Server</label>
          <value>UwU_world.aternos.me:30089</value>
        </div>
        <div class="info-item">
          <label>Status</label>
          <value id="statusDetail">Disconnected</value>
        </div>
        <div class="info-item">
          <label>Uptime</label>
          <value id="uptime">—</value>
        </div>
      </div>
    </div>

    <!-- Terminal / Logs -->
    <div class="terminal">
      <div class="terminal-header">
        <div class="terminal-dots">
          <span></span><span></span><span></span>
        </div>
        Minecraft Server Log
      </div>
      <div class="terminal-body" id="terminal"></div>
    </div>

    <!-- Command Input -->
    <form class="input-area" id="chatForm">
      <input
        type="text"
        id="messageInput"
        placeholder="Send message or /command..."
        autocomplete="off"
        spellcheck="false"
      />
      <button type="submit" class="btn-send" id="sendBtn">
        Send
      </button>
    </form>
  </main>

  <script>
    const terminal = document.getElementById('terminal');
    const statusPill = document.getElementById('statusPill');
    const statusText = document.getElementById('statusText');
    const statusDetail = document.getElementById('statusDetail');
    const uptimeEl = document.getElementById('uptime');
    const messageInput = document.getElementById('messageInput');
    const chatForm = document.getElementById('chatForm');
    const sendBtn = document.getElementById('sendBtn');

    let connectedSince = null;

    function timeStr() {
      return new Date().toLocaleTimeString('en-GB', { hour12: false });
    }

    function addLog(text, type = 'system') {
      const line = document.createElement('div');
      line.className = 'log-line';
      line.innerHTML = `<span class="log-time">[${timeStr()}]</span><span class="log-${type}">${escapeHtml(text)}</span>`;
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function setStatus(online, detail = '') {
      if (online) {
        statusPill.className = 'status-pill online';
        statusText.textContent = 'ONLINE';
        statusDetail.textContent = detail || 'Connected';
        if (!connectedSince) connectedSince = Date.now();
      } else {
        statusPill.className = 'status-pill offline';
        statusText.textContent = 'OFFLINE';
        statusDetail.textContent = detail || 'Disconnected';
        connectedSince = null;
        uptimeEl.textContent = '—';
      }
    }

    function updateUptime() {
      if (!connectedSince) return;
      const sec = Math.floor((Date.now() - connectedSince) / 1000);
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      uptimeEl.textContent = `${h}h ${m}m ${s}s`;
    }

    // Poll /status every 5 seconds
    async function fetchStatus() {
      try {
        const res = await fetch('/status');
        if (!res.ok) throw new Error('offline');
        const data = await res.json();

        setStatus(data.online === true, data.message || 'Connected');

        if (data.logs && Array.isArray(data.logs)) {
          // Optional: if backend sends new logs
        }
      } catch (e) {
        setStatus(false, 'Cannot reach bot');
      }
    }

    // Send chat / command
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = messageInput.value.trim();
      if (!msg) return;

      sendBtn.disabled = true;
      addLog(`→ ${msg}`, 'sent');

      try {
        const res = await fetch('/send-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg })
        });

        if (res.ok) {
          addLog('Message sent', 'success');
        } else {
          const err = await res.text();
          addLog(`Failed: ${err || res.status}`, 'error');
        }
      } catch (err) {
        addLog('Network error – is the bot running?', 'error');
      }

      messageInput.value = '';
      sendBtn.disabled = false;
      messageInput.focus();
    });

    // Init
    addLog('Dashboard loaded. Waiting for bot...', 'system');
    fetchStatus();
    setInterval(fetchStatus, 5000);
    setInterval(updateUptime, 1000);

    // Focus input on load
    messageInput.focus();
  </script>
</body>
</html>
